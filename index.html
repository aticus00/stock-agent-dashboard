<style>
  :root {

    --table-border: #2E7D32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, sans-serif;

  .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; white-space: nowrap; }
  .wrap { max-width: 920px; margin: 0 auto; }
 
  .eyebrow {
    font-size: 14px; letter-spacing: 0.12em; color: var(--accent);

  h1 { font-size: 32px; margin: 0 0 4px; font-weight: 800; }
  .subtext { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
  .headline {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 14px 18px; font-size: 16px; line-height: 1.6;
    margin-bottom: 28px; color: var(--text);
  }

  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 140px;
  }
  .stat-card .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 700; }
  .up { color: var(--up); }
  .down { color: var(--down); }

  section { margin-bottom: 40px; }
  h2 {
    font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 16px; font-weight: 700;
    border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  .legend-note {
    text-transform: none; letter-spacing: normal; font-weight: 400; font-size: 12px;
  }

  .diverge-row {
    display: grid; grid-template-columns: 90px 1fr 60px; align-items: center;
    gap: 10px; padding: 6px 0; font-size: 18px;
  }
  .diverge-name { color: var(--text); }
  .diverge-track {
    position: relative; height: 20px; background: var(--surface-2);
    border-radius: 4px; overflow: hidden;
  }
  .diverge-center {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border);
  }
  .diverge-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
  .diverge-value { text-align: right; font-weight: 600; }

  .table-scroll { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 18px;
    border: 4px solid var(--table-border);
  }
  th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 18px;

  th:last-child, td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }

  .tags { display: flex; flex-direction: column; gap: 8px; }
  .tag {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; cursor: pointer; user-select: none;
  }
  .tag-head { display: flex; align-items: center; gap: 8px; }
  .tag .count {
    background: var(--surface-2); color: var(--accent); border-radius: 999px;
    padding: 1px 8px; font-size: 12px; font-weight: 700;
  }
  .tag .caret { margin-left: auto; color: var(--muted); font-size: 12px; transition: transform 0.15s; }
  .tag.open .caret { transform: rotate(90deg); }
  .tag-detail {
    display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 13.5px; color: var(--muted); line-height: 1.8;
  }
  .tag.open .tag-detail { display: block; }
  .tag-detail-item { color: var(--text); }
  .tag-detail-item a { color: var(--text); text-decoration: none; }
  .tag-detail-item a:hover { color: var(--accent); text-decoration: underline; }
  .tag-detail-item .code { color: var(--accent); margin-right: 6px; font-weight: 600; }

  footer { color: var(--muted); font-size: 13px; margin-top: 40px; line-height: 1.6; }

  .stock-name { font-weight: 700; font-size: 16px; }
  .stock-link, .sector-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .stock-link:hover, .sector-link:hover { color: var(--accent); }
  .perf-out { color: #C62828; }
  .perf-under { color: #1565C0; }

  .chart-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(46, 42, 34, 0.45);
    align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .chart-modal-overlay.open { display: flex; }
  .chart-modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; max-width: 820px; width: 100%; max-height: 90vh; overflow-y: auto;
  }
  .chart-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .chart-modal-head h3 { font-size: 18px; margin: 0; font-weight: 700; }
  .chart-modal-close {
    background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer;
    line-height: 1; padding: 4px 8px;
  }
  .chart-modal-close:hover { color: var(--text); }
  .chart-legend {
    display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 12px;
    font-size: 13px; color: var(--muted); justify-content: center;
  }
  .chart-legend i { display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
</style>

<script>
const data = JSON.parse(document.getElementById('dashboard-data').textContent);
 
function fmtPct(v) {
  if (v === null || v === undefined) return '-';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined) return '-';
  return v.toLocaleString();
}
function colorClass(v) {
  if (v === null || v === undefined) return '';
  return v > 0 ? 'up' : (v < 0 ? 'down' : '');
}
 
document.getElementById('headline').textContent = data.trade_date + ' 시장 리포트';
document.getElementById('subtext').textContent =
  `관측 ${data.prices.length}종목 · 섹터 ${data.sectors.length}개 추적 · 오늘신호 ${data.daily_signals.length}종목 · 누적추천 ${data.cumulative.length}종목`;
document.getElementById('generated-at').textContent = data.generated_at;
document.getElementById('headline-box').textContent = data.headline || '';
 
const s = data.stats;
document.getElementById('stat-row').innerHTML = `
  <div class="stat-card"><div class="label">상승</div><div class="value up">${s.up_count}</div></div>
  <div class="stat-card"><div class="label">하락</div><div class="value down">${s.down_count}</div></div>
  <div class="stat-card"><div class="label">보합</div><div class="value">${s.flat_count}</div></div>
  <div class="stat-card"><div class="label">외국인 순매수</div><div class="value mono ${colorClass(s.total_foreign)}">${fmtNum(s.total_foreign)}</div></div>
  <div class="stat-card"><div class="label">기관 순매수</div><div class="value mono ${colorClass(s.total_inst)}">${fmtNum(s.total_inst)}</div></div>
`;
 
const sectorMmdd = data.trade_date.slice(5).replace('-', '/');
document.getElementById('sector-title').textContent = `${sectorMmdd} 섹터별 등락률`;

const maxAbs = Math.max(1, ...data.sectors.map(sec => Math.abs(sec.avg_change_rate)));
document.getElementById('sector-chart').innerHTML = data.sectors.map((sec, idx) => {
  const pct = Math.min(100, (Math.abs(sec.avg_change_rate) / maxAbs) * 50);
  const isUp = sec.avg_change_rate >= 0;
  const barStyle = isUp
    ? `left:50%; width:${pct}%; background:var(--up);`
    : `right:50%; width:${pct}%; background:var(--down);`;
  return `
    <div class="diverge-row">
      <div class="diverge-name"><span class="sector-link" data-sector-idx="${idx}">${sec.sector}</span></div>
      <div class="diverge-track"><div class="diverge-center"></div><div class="diverge-bar" style="${barStyle}"></div></div>
      <div class="diverge-value ${colorClass(sec.avg_change_rate)} mono">${fmtPct(sec.avg_change_rate)}</div>
    </div>`;
}).join('');

document.getElementById('sector-chart').addEventListener('click', (e) => {
  const link = e.target.closest('.sector-link');
  if (!link) return;
  const idx = parseInt(link.dataset.sectorIdx, 10);
  renderSectorChart(data.sectors[idx]);
});

// 색상 수를 줄이고(7개), 색상을 다 쓰고 나면 같은 색을 점선으로 재사용해서
// 구분한다 - 13개 섹터를 13가지 색으로 구분하려니 비슷한 색끼리 헷갈렸던 문제 개선.
const SECTOR_COLORS = ['#2E2A22', '#C62828', '#3A6EA5', '#E91E63', '#2E7D32', '#F9A825'];
const sectorCumulativeLines = data.sectors.map((sec, i) => {
  const isDashed = i >= SECTOR_COLORS.length;
  return {
    key: sec.sector, color: SECTOR_COLORS[i % SECTOR_COLORS.length], width: 2.5, label: sec.sector,
    dash: isDashed ? '6,4' : null,
  };
});
document.getElementById('sector-cumulative-chart').innerHTML =
  buildChartMarkup(data.sector_cumulative_series || [], 'date', sectorCumulativeLines, { height: 460, endLabels: true });

function newsCellHtml(sig) {
  return sig.top_news
    ? (sig.top_news_url
        ? `<a href="${sig.top_news_url}" target="_blank" rel="noopener">${sig.top_news} ↗</a>`
        : sig.top_news)
    : '관련 뉴스 없음';
}

const dailySignalsTbody = document.querySelector('#daily-signals-table tbody');
dailySignalsTbody.innerHTML = data.daily_signals.map(sig => `
  <tr>
    <td class="mono">${sig.display_time || '-'}</td>
    <td class="mono">${sig.stock_code}</td>
    <td class="stock-name">${sig.stock_name || '-'}</td>
    <td class="num mono">${fmtNum(sig.price)}</td>
    <td style="color:var(--muted); font-size:17px;">${newsCellHtml(sig)}</td>
  </tr>`
).join('') || '<tr><td colspan="5" style="color:var(--muted)">오늘 생성된 신호가 없습니다.</td></tr>';

function benchmarkDiffClass(c) {
  const benchmark = c.market === 'KOSDAQ' ? c.kosdaq_return_pct : c.kospi_return_pct;
  if (c.return_pct === null || c.return_pct === undefined || benchmark === null || benchmark === undefined) return '';
  const diff = c.return_pct - benchmark;
  if (diff > 1) return 'perf-out';
  if (diff < -1) return 'perf-under';
  return '';
}

const cumulativeTbody = document.querySelector('#cumulative-table tbody');
cumulativeTbody.innerHTML = data.cumulative.map((c, idx) => {
  const kospiCell = c.market === 'KOSDAQ'
    ? '<td class="num mono" style="color:var(--muted);">-</td>'
    : `<td class="num mono ${colorClass(c.kospi_return_pct)}">${fmtPct(c.kospi_return_pct)}</td>`;
  const kosdaqCell = c.market === 'KOSPI'
    ? '<td class="num mono" style="color:var(--muted);">-</td>'
    : `<td class="num mono ${colorClass(c.kosdaq_return_pct)}">${fmtPct(c.kosdaq_return_pct)}</td>`;
  return `
  <tr>
    <td class="num mono">${idx + 1}</td>
    <td class="mono">${c.stock_code}</td>
    <td><span class="stock-link stock-name ${benchmarkDiffClass(c)}" data-idx="${idx}">${c.stock_name || '-'}</span> (${c.count}회)</td>
    <td class="mono">${c.first_date}</td>
    <td class="num mono">${fmtNum(c.first_price)}</td>
    <td class="num mono">${fmtNum(c.current_price)}</td>
    <td class="num mono ${colorClass(c.return_pct)}">${fmtPct(c.return_pct)}</td>
    ${kospiCell}
    ${kosdaqCell}
    <td style="color:var(--muted); font-size:17px;">${newsCellHtml(c)}</td>
  </tr>`;
}).join('') || '<tr><td colspan="10" style="color:var(--muted)">누적된 추천 종목이 없습니다.</td></tr>';

function buildLinePath(values, xScale, yScale) {
  let d = '';
  let started = false;
  values.forEach((v, i) => {
    if (v === null || v === undefined) { started = false; return; }
    const x = xScale(i);
    const y = yScale(v);
    d += (started ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    started = true;
  });
  return d.trim();
}

function buildChartMarkup(series, dateKey, lines, opts) {
  opts = opts || {};
  const useEndLabels = !!opts.endLabels;

  if (!series || series.length === 0) {
    return '<div style="color:var(--muted); padding:40px; text-align:center;">차트 데이터가 없습니다.</div>';
  }

  const W = 760, H = opts.height || 320, padL = 54, padR = useEndLabels ? 96 : 20, padT = 20, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const valuesByLine = lines.map(line => series.map(p => p[line.key]));
  const allVals = valuesByLine.flat().filter(v => v !== null && v !== undefined);

  let minV = Math.min(0, ...allVals);
  let maxV = Math.max(0, ...allVals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV - minV) * 0.08;
  minV -= pad; maxV += pad;

  const xScale = i => padL + (series.length === 1 ? plotW / 2 : (i / (series.length - 1)) * plotW);
  const yScale = v => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;
  const zeroY = yScale(0);

  const tickIdxs = series.length <= 6
    ? series.map((_, i) => i)
    : [0, Math.round((series.length - 1) * 0.25), Math.round((series.length - 1) * 0.5), Math.round((series.length - 1) * 0.75), series.length - 1];
  const uniqueTicks = [...new Set(tickIdxs)];

  let yTicksHtml = '';
  const yTicksCount = 5;
  for (let t = 0; t <= yTicksCount; t++) {
    const val = minV + (maxV - minV) * (t / yTicksCount);
    const y = yScale(val);
    yTicksHtml += `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" />
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${val.toFixed(1)}%</text>
    `;
  }

  const xTicksHtml = uniqueTicks.map(i => `
    <text x="${xScale(i).toFixed(1)}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${series[i][dateKey].slice(5)}</text>
  `).join('');

  const pathsHtml = lines.map((line, i) => {
    const path = buildLinePath(valuesByLine[i], xScale, yScale);
    const width = line.width || 4;
    const opacity = line.opacity === undefined ? 1 : line.opacity;
    const dashAttr = line.dash ? ` stroke-dasharray="${line.dash}"` : '';
    return `<path d="${path}" fill="none" stroke="${line.color}" stroke-width="${width}" stroke-opacity="${opacity}"${dashAttr} />`;
  }).join('');

  let legendHtml = '';
  let endLabelsHtml = '';

  if (useEndLabels) {
    // 마지막 유효값 기준으로 오른쪽 Y축에 섹터명을 직접 표시 - 값이 높은 순서대로
    // 위에서 아래로. 값이 비슷해서 라벨끼리 겹치면 최소 간격만큼 밀어서 벌린다.
    const items = lines.map((line, i) => {
      const vals = valuesByLine[i];
      let lastVal = null;
      for (let j = vals.length - 1; j >= 0; j--) {
        if (vals[j] !== null && vals[j] !== undefined) { lastVal = vals[j]; break; }
      }
      return lastVal === null ? null : { line, y: yScale(lastVal) };
    }).filter(item => item !== null);

    items.sort((a, b) => a.y - b.y);
    const minGap = 14;
    for (let i = 1; i < items.length; i++) {
      if (items[i].y - items[i - 1].y < minGap) {
        items[i].y = items[i - 1].y + minGap;
      }
    }

    endLabelsHtml = items.map(item => `
      <text x="${(W - padR + 8).toFixed(1)}" y="${(item.y + 4).toFixed(1)}" font-size="12" font-weight="600" fill="${item.line.color}">${item.line.label}</text>
    `).join('');
  } else {
    legendHtml = lines.map(line => {
      const swatchStyle = line.dash
        ? `background:none; border-bottom:3px dashed ${line.color}; height:0;`
        : `background:${line.color};`;
      return `<span><i style="${swatchStyle}"></i>${line.label}</span>`;
    }).join('');
  }

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
      ${yTicksHtml}
      <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4,3" />
      ${xTicksHtml}
      ${pathsHtml}
      ${endLabelsHtml}
    </svg>
    ${useEndLabels ? '' : `<div class="chart-legend">${legendHtml}</div>`}
  `;
}

function renderLineChart(title, series, dateKey, lines) {
  document.getElementById('chart-modal-title').textContent = title;
  document.getElementById('chart-svg-wrap').innerHTML = buildChartMarkup(series, dateKey, lines);
  document.getElementById('chart-modal').classList.add('open');
}

function renderReturnChart(row) {
  const kospiOpacity = row.market === 'KOSDAQ' ? 0.25 : 1;
  const kosdaqOpacity = row.market === 'KOSPI' ? 0.25 : 1;
  renderLineChart(
    `${row.stock_name} (${row.stock_code}) 수익률 추이`,
    row.series || [],
    'date',
    [
      { key: 'kospi_return_pct', color: '#3A6EA5', width: 4, opacity: kospiOpacity, label: '코스피' },
      { key: 'kosdaq_return_pct', color: '#2E7D32', width: 4, opacity: kosdaqOpacity, label: '코스닥' },
      { key: 'return_pct', color: '#B8791F', width: 4.5, label: `<span class="stock-name">${row.stock_name}</span>` },
    ]
  );
}

function renderSectorChart(sector) {
  renderLineChart(
    `${sector.sector} 섹터 누적 등락률 추이`,
    sector.series || [],
    'date',
    [
      { key: 'cumulative_pct', color: '#B8791F', width: 4.5, label: sector.sector },
    ]
  );
}

cumulativeTbody.addEventListener('click', (e) => {
  const link = e.target.closest('.stock-link');
  if (!link) return;
  const idx = parseInt(link.dataset.idx, 10);
  renderReturnChart(data.cumulative[idx]);
});

document.getElementById('chart-modal-close').addEventListener('click', () => {
  document.getElementById('chart-modal').classList.remove('open');
});
document.getElementById('chart-modal').addEventListener('click', (e) => {
  if (e.target.id === 'chart-modal') {
    document.getElementById('chart-modal').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('chart-modal').classList.remove('open');
});
</script>
